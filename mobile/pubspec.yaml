name: melarium_mobile
description: MELARIUM - Agro Investment Platform Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.4.3+1

  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Navigation
  go_router: ^13.2.0

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
