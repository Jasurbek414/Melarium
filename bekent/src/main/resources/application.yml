spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/melarium_db}
    username: ${SPRING_DATASOURCE_USERNAME:melarium_user}
    password: ${SPRING_DATASOURCE_PASSWORD:melarium_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── GMAIL SMTP ─────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:azizbekmirzavaliyev31@gmail.com}
    password: ${MAIL_PASSWORD:iwcaugykkssrrtka}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # ── ASYNC CONFIG ───────────────────────────────────────────
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

melarium:
  jwt:
    secret: ${JWT_SECRET:mElaRiUm-5uPeR-5eCrEt-K3y-2024-AgRoInVeStMeNtPlAtFoRm}
    access-token-expiry-ms: 900000         # 15 minutes
    refresh-token-expiry-ms: 604800000     # 7 days

  otp:
    expiry-seconds: 120
    length: 6
    simulate: ${OTP_SIMULATE:false}         # false = real email, true = return in response

  payment:
    simulate: true
    click-merchant-id: "MOCK_CLICK"
    payme-merchant-id: "MOCK_PAYME"

  commission:
    investment-pct: 8.0
    honey-sale-pct: 12.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.melarium: DEBUG
    org.springframework.security: WARN
    org.springframework.mail: INFO

